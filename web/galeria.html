<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOMNIUM - Galeria</title>
<style>
:root { --navy: #1B3A5C; --gold: #C49A3C; --light-gold: #F5E6C8; --dark: #333; --light: #F5F5F5; --white: #fff; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f0; color: var(--dark);
  position: relative; }
body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: url('images/bg.jpg') center/cover no-repeat; opacity: 0.08; z-index: -1; pointer-events: none; }

.header { background: var(--navy); color: var(--white); text-align: center; padding: 2rem 1rem; }
.header h1 { font-size: 2.2rem; letter-spacing: 6px; margin-bottom: 0.3rem; }
.header .tagline { color: var(--gold); font-style: italic; font-size: 1rem; }
.header .subtitle { font-size: 1.4rem; margin-top: 1rem; font-weight: 300; }
.header nav { margin-top: 1rem; }
.header nav a { color: var(--light-gold); text-decoration: none; margin: 0 1rem; font-size: 0.9rem;
  transition: color 0.2s; }
.header nav a:hover { color: var(--white); }

.container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }

/* Filters */
.filters { text-align: center; margin: 1.5rem 0; }
.filters button { background: var(--white); border: 2px solid var(--navy); color: var(--navy);
  padding: 0.5rem 1.2rem; border-radius: 25px; margin: 0.3rem; cursor: pointer; font-size: 0.9rem;
  font-weight: 600; transition: all 0.3s; }
.filters button:hover, .filters button.active { background: var(--navy); color: var(--white); }

/* Gallery Grid */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px; margin-top: 1rem; }
.gallery-item { position: relative; overflow: hidden; border-radius: 8px; cursor: pointer;
  aspect-ratio: 4/3; background: #ddd; }
.gallery-item img { width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.4s ease, filter 0.4s ease; display: block; }
.gallery-item:hover img { transform: scale(1.05); filter: brightness(1.1); }
.gallery-item::after { content: ''; position: absolute; inset: 0; background:
  linear-gradient(to top, rgba(27,58,92,0.4) 0%, transparent 40%);
  opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.gallery-item:hover::after { opacity: 1; }

/* Lightbox */
.lightbox { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.92);
  align-items: center; justify-content: center; }
.lightbox.active { display: flex; }
.lightbox img { max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 4px;
  box-shadow: 0 4px 40px rgba(0,0,0,0.5); }
.lightbox-close { position: absolute; top: 20px; right: 25px; color: #fff; font-size: 2.5rem;
  cursor: pointer; opacity: 0.7; transition: opacity 0.2s; z-index: 1001;
  width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
.lightbox-close:hover { opacity: 1; }
.lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); color: #fff;
  font-size: 3rem; cursor: pointer; opacity: 0.6; transition: opacity 0.2s; padding: 0 15px;
  user-select: none; z-index: 1001; }
.lightbox-nav:hover { opacity: 1; }
.lightbox-prev { left: 10px; }
.lightbox-next { right: 10px; }
.lightbox-counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.7); font-size: 0.9rem; }

/* Footer */
.footer { text-align: center; padding: 1.5rem; color: #999; font-size: 0.8rem; margin-top: 2rem; }

/* Responsive */
@media (max-width: 768px) {
  .header h1 { font-size: 1.6rem; letter-spacing: 3px; }
  .gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .lightbox-nav { font-size: 2rem; }
}
@media (min-width: 1200px) {
  .gallery { grid-template-columns: repeat(4, 1fr); }
}

.has-music-bar .footer { padding-bottom: 90px; }
</style>
</head>
<body>

<div class="header">
  <h1>SOMNIUM</h1>
  <div class="tagline">Donde tus sueños encuentran su hogar</div>
  <div class="subtitle">Galeria</div>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="calculadora.html">Calculadora</a>
    <a href="galeria.html">Galeria</a>
  </nav>
</div>

<div class="container">
  <div class="filters">
    <button class="active" data-filter="all">Todas</button>
    <button data-filter="interior">Interiores</button>
    <button data-filter="vista">Vistas</button>
    <button data-filter="barrio">Barrio</button>
  </div>
  <div class="gallery" id="gallery"></div>
</div>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close" id="lb-close">&times;</span>
  <span class="lightbox-nav lightbox-prev" id="lb-prev">&#10094;</span>
  <span class="lightbox-nav lightbox-next" id="lb-next">&#10095;</span>
  <img id="lb-img" src="" alt="">
  <div class="lightbox-counter" id="lb-counter"></div>
</div>

<div class="footer">
  SOMNIUM &bull; Av. Coronel Diaz 1736, CABA<br>
  Palermo, Buenos Aires
</div>

<script>
const photos = [
  // Interiores amoblados
  {src:"palermo-1", cat:"interior"},
  {src:"palermo-2", cat:"interior"},
  {src:"palermo-3", cat:"interior"},
  {src:"palermo-4", cat:"interior"},
  {src:"palermo-5", cat:"interior"},
  {src:"palermo-6", cat:"interior"},
  {src:"palermo-7", cat:"interior"},
  {src:"palermo-8", cat:"interior"},
  {src:"palermo-9", cat:"interior"},
  {src:"palermo-10", cat:"interior"},
  {src:"palermo-11", cat:"interior"},
  {src:"palermo-12", cat:"interior"},
  {src:"palermo-13", cat:"interior"},
  {src:"palermo-14", cat:"interior"},
  {src:"palermo-15", cat:"interior"},
  {src:"palermo-16", cat:"interior"},
  {src:"palermo-17", cat:"interior"},
  {src:"palermo-18", cat:"interior"},
  {src:"palermo-19", cat:"interior"},
  {src:"palermo-20", cat:"interior"},
  {src:"palermo-21", cat:"interior"},
  {src:"palermo-22", cat:"interior"},
  {src:"palermo-23", cat:"interior"},
  {src:"palermo-24", cat:"interior"},
  {src:"palermo-25", cat:"interior"},
  {src:"palermo-26", cat:"interior"},
  {src:"palermo-27", cat:"interior"},
  {src:"palermo-28", cat:"interior"},
  {src:"palermo-29", cat:"interior"},
  // Interiores sin amoblar
  {src:"palermo-30", cat:"interior"},
  {src:"palermo-31", cat:"interior"},
  {src:"palermo-32", cat:"interior"},
  {src:"palermo-33", cat:"interior"},
  {src:"palermo-34", cat:"interior"},
  {src:"palermo-36", cat:"interior"},
  {src:"palermo-37", cat:"interior"},
  {src:"palermo-50", cat:"interior"},
  // Vistas desde balcones
  {src:"palermo-40", cat:"vista"},
  {src:"palermo-41", cat:"vista"},
  {src:"palermo-46", cat:"vista"},
  {src:"palermo-47", cat:"vista"},
  {src:"palermo-48", cat:"vista"},
  {src:"palermo-49", cat:"vista"},
  // Barrio / exterior
  {src:"IMG_0266", cat:"barrio"},
  {src:"IMG_0267", cat:"barrio"},
  {src:"IMG_0269", cat:"barrio"},
  {src:"IMG_0270", cat:"barrio"},
  {src:"IMG_0273", cat:"barrio"},
  {src:"IMG_0275", cat:"barrio"},
  {src:"IMG_0276", cat:"barrio"},
];

let filtered = [...photos];
let currentIdx = 0;

function render(filter) {
  filtered = filter === 'all' ? [...photos] : photos.filter(p => p.cat === filter);
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  filtered.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.innerHTML = `<img src="images/galeria/thumbs/${p.src}.jpg" alt="SOMNIUM" loading="lazy">`;
    div.onclick = () => openLightbox(i);
    gallery.appendChild(div);
  });
}

function openLightbox(idx) {
  currentIdx = idx;
  const lb = document.getElementById('lightbox');
  lb.classList.add('active');
  updateLightbox();
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}

function updateLightbox() {
  const p = filtered[currentIdx];
  document.getElementById('lb-img').src = 'images/galeria/' + p.src + '.jpg';
  document.getElementById('lb-counter').textContent = (currentIdx + 1) + ' / ' + filtered.length;
}

function navLightbox(dir) {
  currentIdx = (currentIdx + dir + filtered.length) % filtered.length;
  updateLightbox();
}

document.getElementById('lb-close').onclick = closeLightbox;
document.getElementById('lb-prev').onclick = () => navLightbox(-1);
document.getElementById('lb-next').onclick = () => navLightbox(1);
document.getElementById('lightbox').onclick = (e) => { if (e.target.id === 'lightbox') closeLightbox(); };

document.addEventListener('keydown', (e) => {
  const lb = document.getElementById('lightbox');
  if (!lb.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});

// Filter buttons
document.querySelectorAll('.filters button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
  };
});

// Touch swipe support
let touchStartX = 0;
document.getElementById('lightbox').addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, {passive: true});
document.getElementById('lightbox').addEventListener('touchend', (e) => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(diff) > 50) navLightbox(diff > 0 ? -1 : 1);
}, {passive: true});

render('all');
</script>

<!-- Spotify music player -->
<style>
#music-bar{position:fixed;bottom:0;left:0;right:0;z-index:999;
  box-shadow:0 -2px 12px rgba(0,0,0,0.3);}
#music-bar iframe{border-radius:0;display:block;}
#music-close{position:absolute;top:8px;right:12px;color:#fff;cursor:pointer;font-size:16px;
  opacity:0.6;transition:opacity 0.2s;z-index:1000;background:rgba(0,0,0,0.5);
  border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
#music-close:hover{opacity:1;}
</style>
<div id="music-bar">
  <span id="music-close" onclick="document.getElementById('music-bar').style.display='none';document.body.classList.remove('has-music-bar');" title="Cerrar">&#10005;</span>
  <iframe src="https://open.spotify.com/embed/album/7ti90Q0M8tWeYjl2wzY3On?utm_source=generator&theme=0"
    width="100%" height="80" frameborder="0"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy" style="border-radius:0"></iframe>
</div>
<script>document.body.classList.add('has-music-bar');</script>
</body>
</html>
